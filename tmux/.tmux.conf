
# Terminal overrides for proper color and theme support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[0 q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

set-option -g detach-on-destroy off

set-option -g status-position top
set-window-option -g clock-mode-colour orange
set-window-option -g clock-mode-style 12

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# Automatic window naming: the `claude` binary is a symlink to a
# version-named executable (e.g. 2.1.232), so the default format shows
# that instead of "claude"; plain shells all just show "zsh". Use the
# claude version pattern to catch claude panes, the current directory's
# basename for plain shells, and fall back to the process name otherwise.
setw -g automatic-rename on
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},-zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},sh},#{==:#{pane_current_command},fish}}}}},#{b:pane_current_path},#{pane_current_command}}}}#{?pane_dead,[dead],}"

# Enable focus events so vim can detect background changes
set -g focus-events on

# Allow background color to be updated
set -ga update-environment 'TERM_PROGRAM'

# NOTE: Allow terminal emulator sequences to pass through
# set -g allow-passthrough on

unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# splits
bind - split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# Quick pane switching with Alt+arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window navigation
bind n new-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

bind H select-window -t :-  # left
bind L select-window -t :+  # right

# Easy window navigation with prefix+number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3

# Session navigation
bind S command-prompt "switch-client -t %%"  # Quick session switch
bind K confirm-before -p "kill-session #S? (y/n)" kill-session
bind N command-prompt "new-session -s '%%'"
bind -r p run-shell "~/bin/tmux-sessionizer"
bind P choose-tree

# Toggle between the last two windows
bind Space last-window

# Enter copy mode with prefix+[
bind [ copy-mode

## Referece
# bind g display-popup -E -w 90% -h 80% "lazygit"  # for floating windows
# bind g split-window -h "lazygit"  # for vertical split

# urls https://github.com/wtfox/dotfiles.git
# <prefix> + Ctrl+u → open urlscan in a tmux popup
bind -T prefix C-u display-popup -E -w 90% -h 80% "sh -lc 'tmux capture-pane -J -p -S  ! | urlview'"
bind g new-window "lazygit --use-config-file ~/.config/lazygit/config.yml"
bind c new-window "claude"
bind C display-popup -E -w 85% -h 80% "~/bin/tmux-worktree"
bind a display-popup -E -w 85% -h 80% "~/bin/tmux-claude-panes"
bind d display-popup -E -w 85% -h 80% "~/bin/tmux-docker"
bind b new-window "btop"
bind m new-window "screensaver.sh"

# Scratch shell popup — backed by a real session so it keeps its state
# between toggles. Runs on its own tmux server (-L popup) rather than this
# one: the popup's shell is itself a full nested tmux client, so any
# session-switch bind pressed while it has focus (sessionizer, choose-tree,
# etc.) would otherwise navigate *that* client to another session on this
# server — the popup border stays up, now just displaying whatever it got
# switched to, and the "am I in scratch" close-check can never match again.
# An isolated server has nowhere else for it to switch to, so that class of
# bug can't happen. detach-on-destroy is forced on for the session too (see
# the global off setting further up, kept for worktree removal) so the
# popup still closes cleanly if the shell simply exits.
bind ';' if-shell -F '#{==:#{session_name},scratch}' \
    { detach-client } \
    { display-popup -d "#{pane_current_path}" -w 80% -h 75% -E "tmux -L popup new-session -A -s scratch \; set-option -t scratch detach-on-destroy on" }

# Mouse mode (for easy scrolling and selection)
set -g mouse on

# Vim-like key bindings in copy mode
setw -g mode-keys vi

set -g @tmux2k-theme 'duo'
set -g @tmux2k-duo-fg "#7a7a7a"
set -g @tmux2k-duo-bg "#060606"
set -g @tmux2k-left-plugins "session git" # can also do cpu, ram
set -g @tmux2k-right-plugins "time" # can also do battery, network
set -g @tmux2k-left-sep 
set -g @tmux2k-right-sep 
set -g @tmux2k-window-list-right-sep 
set -g @tmux2k-window-list-left-sep 
set -g @tmux2k-icons-only true
set -g @tmux2k-show-powerline true
set -g @tmux2k-refresh-rate 5

